name: Stage upstream integration November 2

on:
  push:
    branches: [beta-upstream-2026-11-02]

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: beta-upstream-2026-11-02
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate pinned upstream without modifying beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/storytold/craft-launcher.git
          git fetch --no-tags upstream ec205366ebe42635e155b9ab246f036052fef406
          echo "::group::Upstream history"
          git log --oneline --max-count=10 FETCH_HEAD
          echo "::endgroup::"
          set +e
          git merge --no-ff --no-commit -X theirs FETCH_HEAD
          rc=$?
          set -e
          git status --short
          if [ "$rc" -ne 0 ] || [ -n "$(git ls-files -u)" ]; then
            echo "::error::Manual merge conflicts: no source files are pushed."
            git ls-files -u
            exit 1
          fi
          git diff --cached --stat
          git diff --cached --name-only > /tmp/upstream-files.txt
          echo "::group::Upstream changed paths"
          cat /tmp/upstream-files.txt
          echo "::endgroup::"
          git commit -m "Merge upstream main November 2 2026 into SuiteDock staging"
          git push origin HEAD:beta-upstream-2026-11-02
